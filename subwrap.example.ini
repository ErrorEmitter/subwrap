# subwrap configuration. Copy this to `subwrap.ini` and edit.
#   python subwrap.py                  # reads ./subwrap.ini
#   python subwrap.py /path/to.ini     # reads a specific file
# If no config file is found, built-in defaults are used (base=rp.localhost,
# port=80, bind=loopback, no aliases).

[server]

# Base domain. Everything under *.<base> is handled by the proxy.
#   base = rp.localhost          # recommended for local use
# IMPORTANT: a *.localhost base is a "secure context" over plain HTTP, so the
# Service-Worker layer works. A non-.localhost base (e.g. a LAN name below) is
# NOT a secure context over HTTP, so Service Workers won't register there -- the
# static-rewrite + JS-shim + WebSocket layers still work, just not the SW layer.
base = rp.localhost

# Listen port. 80 gives clean URLs with no :port suffix.
port = 80

# Which addresses to bind:
#   loopback   this machine only  (127.0.0.1 + ::1)   <- default, safest
#   all        every interface    (0.0.0.0 + ::)      <- reachable from the LAN
#   a,b,c      explicit addresses  e.g.  192.168.1.50, ::1
#
# WARNING: `all` (or any non-loopback address) makes this an OPEN reverse proxy
# that anyone on your network can use to reach arbitrary sites through this
# machine. Only enable it on a trusted network.
bind = loopback


# LAN example -------------------------------------------------------------------
# To reach internal services from other machines, run on the host (say la-pc-01)
# with something like:
#   [server]
#   base = rp.la-pc-01.local
#   port = 80
#   bind = all
# Then, with wildcard DNS for *.rp.la-pc-01.local pointing at this host, a client
# can open an internal HTTPS service by its long form, e.g.:
#   http://git.corp.lan.443.https.rp.la-pc-01.local/   ->   https://git.corp.lan/
# (plain mDNS has no wildcards, so you need a real DNS server or per-name hosts
#  entries for the clients.)


[aliases]
# Short domains: <short-label> = <target-url>
# The label becomes http://<label>.<base>/ and is what shows in the browser;
# the long encoded form of the same target redirects to it.
#
#   example  = https://example.com
#   git      = https://git.corp.lan
#   app8080  = https://a.internal:8080
